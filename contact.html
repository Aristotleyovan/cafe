<div  class="main">
<div>
    
    <div class="contact">
        <h4>CONTACT US</h4>
        <h1>Make a Reservation<br>Or Visit Our Cafe</h1>
        <p>Enjoy delicious food and fresh coffee.</p>

       <div class="card">
           <h3>Phone Number</h3>
            <p>9876543210</p>
        </div>

        <div class="card">
            <h3>Email</h3>
            <p>hello@leoscafe.com</p>
        </div>
    </div>
</div>

  <div class="form">
    <h2>Table Reservation</h2>

    <form onsubmit="sendMail(event)">
        <input type="text" placeholder="Your Name" name="u_name" required>
        <input type="email" placeholder="Your Email" name="u_email">
        <input type="tel" placeholder="Phone Number" name="phone" required>
        <input type="number" placeholder="Number of Guests" name="guest">
        <input type="date" name="date">
        <input type="time" name="time">
        <textarea placeholder="Message" name="msg"></textarea>
        <button type="submit">Make a Reservation</button>
  </form>
  </div>

</div>

</body>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  (function () {
    emailjs.init("XDc0t3xs6NlFZ53A6");
  })();

   function sendMail(event) {
    event.preventDefault();
    emailjs
      .sendForm(
        "service_pgbwuz3",
        "template_zups5x8",
        event.target
      )
      .then(
        function () {
          alert("Message sent successfully!");
          event.target.reset();
        },
        function (error) {
          alert("Failed to send message");
          console.error(error);
        }
      );
    }
</script>
